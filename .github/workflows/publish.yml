# Publishes to npm when a release tag is pushed. Authenticates with npm's
# trusted publishing (OIDC) — no token lives in the repo or its secrets, and
# npm attaches provenance to the release. One-time setup on npmjs.com:
# package settings → Trusted publisher → GitHub Actions, repository
# ilikescience/category-colors, workflow publish.yml.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm publish
